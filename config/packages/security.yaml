security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                # No "property": App\Repository\UserRepository implements
                # UserLoaderInterface so the lookup is case-insensitive on
                # every database engine (PostgreSQL compares case-sensitively,
                # MariaDB's default collation does not).
                class: App\Entity\User

    role_hierarchy:
        ROLE_MECHANIC: ROLE_USER
        ROLE_ADMIN: ROLE_MECHANIC

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            # Brute-force protection for the login form: 5 attempts per
            # username+IP per minute (and 5x that per IP), reset on success.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                # Logout only via POST + CSRF token (see templates/layout.html.twig),
                # so a cross-site GET or a link prefetch can never end a session.
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/locale/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
