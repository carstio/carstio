services:
  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Map MariaDB to a non-default host port so it does not clash with a
      # local mysqld. Override DATABASE_URL in .env.local with port 3307 if
      # you want to run the app outside Docker against the same database.
      - "3307:3306"
  ###< doctrine/doctrine-bundle ###

  web:
    ports:
      - "${WEB_PORT:-8080}:80"

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###
