# Login
login:
    title: Connexion
    heading: Bon retour
    subtitle: Connectez-vous pour accéder à votre atelier.
    email: Adresse e-mail
    email_placeholder: vous@exemple.fr
    password: Mot de passe
    password_placeholder: Votre mot de passe
    submit: Se connecter

# Forgotten password (pages before login)
password_reset:
    link: "Mot de passe oublié ?"
    request:
        title: "Réinitialiser le mot de passe"
        heading: "Mot de passe oublié ?"
        subtitle: "Saisissez l'adresse e-mail de votre compte et nous vous enverrons un lien pour choisir un nouveau mot de passe."
        email: "Adresse e-mail"
        submit: "Envoyer le lien"
        back_to_login: "Retour à la connexion"
        unavailable: "La réinitialisation du mot de passe par e-mail n'est pas configurée ici. Demandez à un administrateur de vous attribuer un nouveau mot de passe."
        too_many: "Trop de tentatives. Veuillez réessayer plus tard."
    sent:
        heading: "Consultez votre messagerie"
        text: "Si un compte actif existe pour cette adresse, nous lui avons envoyé un lien pour choisir un nouveau mot de passe. Le lien est valable %minutes% minutes."
        hint: "Rien reçu ? Vérifiez le dossier des courriers indésirables ou demandez à un administrateur de vous attribuer un nouveau mot de passe."
    confirm:
        heading: "Choisissez un nouveau mot de passe"
        password: "Nouveau mot de passe"
        password_repeat: "Répétez le nouveau mot de passe"
        submit: "Enregistrer le nouveau mot de passe"

