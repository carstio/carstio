# Login
login:
    title: Log in
    heading: Welcome back
    subtitle: Sign in to access your workshop.
    email: Email address
    email_placeholder: you@example.com
    password: Password
    password_placeholder: Your password
    submit: Log in

# Forgotten password (pages before login)
password_reset:
    link: "Forgot your password?"
    request:
        title: "Reset password"
        heading: "Forgot your password?"
        subtitle: "Enter the email address of your account and we will send you a link to choose a new password."
        email: "Email address"
        submit: "Send the link"
        back_to_login: "Back to log in"
        unavailable: "Password reset by email is not set up here. Please ask an administrator to set a new password for you."
        too_many: "Too many attempts. Please try again later."
    sent:
        heading: "Check your email"
        text: "If there is an active account for that address, we have sent it a link to choose a new password. The link is valid for %minutes% minutes."
        hint: "Nothing arrived? Look in the spam folder, or ask an administrator to set a new password for you."
    confirm:
        heading: "Choose a new password"
        password: "New password"
        password_repeat: "Repeat the new password"
        submit: "Save the new password"

